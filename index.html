<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>CÓ Ạ</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<script>
const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");
let W,H,dpr,fontSize,step,columns,drops,speeds;

function setup(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  fontSize=W<600?18:22;
  step=fontSize*2.65;
  columns=Math.ceil(W/step)+1;
  drops=Array.from({length:columns},()=>-Math.random()*60);
  speeds=Array.from({length:columns},()=>0.45+Math.random()*0.9);
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
}

function frame(){
  ctx.fillStyle="rgba(0,0,0,0.105)";
  ctx.fillRect(0,0,W,H);
  ctx.font=`700 ${fontSize}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
  ctx.textBaseline="top";
  ctx.shadowBlur=7;
  ctx.shadowColor="#00ff66";

  for(let i=0;i<columns;i++){
    const px=i*step;
    const py=drops[i]*fontSize;
    ctx.fillStyle=Math.random()>0.94 ? "#e6ffed" : "#00ff66";
    ctx.fillText("CÓ Ạ",px,py);
    drops[i]+=speeds[i];

    if(py>H+80 && Math.random()>0.965){
      drops[i]=-Math.random()*45;
      speeds[i]=0.45+Math.random()*0.9;
    }
  }
  ctx.shadowBlur=0;
  requestAnimationFrame(frame);
}
window.addEventListener("resize",setup);
setup(); frame();
</script>
</body>
</html>
